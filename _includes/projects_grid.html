{% assign sorted_projects = site.projects | sort: 'date' | reverse %}

<div class="projects-section">
    <div class="container">
        <h2>Featured Projects</h2>

        <div class="projects-container">
            <button id="btn-prev" class="scroll-btn" onclick="scrollProjects(-1)" style="display: none;">
                ←
            </button>

            <div id="projects-scroller" class="projects-scroller">

                {% for project in sorted_projects %}
                <div class="project-card">
                    <a href="{{ project.url | relative_url }}" class="card" style="display: flex; flex-direction: column; height: 100%; text-decoration: none; color: inherit;">

                        {% if project.image %}
                        <img src="{{ project.image | relative_url }}" class="card-img-top" alt="{{ project.title }}">
                        {% endif %}

                        <div class="card-body" style="flex: 1; display: flex; flex-direction: column;">
                            <h4 class="card-title">{{ project.title }}</h4>
                            <p class="card-text" style="flex: 1;">{{ project.description }}</p>
                            <div class="btn btn-primary" style="align-self: flex-start;">View Project →</div>
                        </div>

                    </a>
                </div>
                {% endfor %}

            </div>

            <button id="btn-next" class="scroll-btn" onclick="scrollProjects(1);">
                →
            </button>
        </div>
    </div>
</div>

<script>
    const container = document.getElementById('projects-scroller');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');

    function scrollProjects(direction) {
        const scrollAmount = container.clientWidth / (window.innerWidth < 768 ? 1 : 3);
        container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
    }

    function updateArrowVisibility() {
        const tolerance = 5;

        if (container.scrollLeft <= tolerance) {
            btnPrev.style.display = 'none';
        } else {
            btnPrev.style.display = 'flex';
        }

        if (container.scrollLeft + container.clientWidth >= container.scrollWidth - tolerance) {
            btnNext.style.display = 'none';
        } else {
            btnNext.style.display = 'flex';
        }
    }

    container.addEventListener('scroll', updateArrowVisibility);
    window.addEventListener('resize', updateArrowVisibility);
    document.addEventListener('DOMContentLoaded', updateArrowVisibility);
</script>
