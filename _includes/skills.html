<div id="skills" class="section section-light">
    <div class="container">
        <h2 style="text-align: center; margin-bottom: 3rem;">Technical Skills</h2>

        <div class="grid grid-3">

            {% for category in site.data.skills %}
            <div class="skill-category card">
                <div class="card-body p-4" style="text-align: center;">

                    {% if category.category %}
                    <h4 class="card-title fw-bold mb-4">{{ category.category }}</h4>
                    {% endif %}

                    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem;">
                        {% for skill in category.items %}
                        <span class="skill-badge">{{ skill }}</span>
                        {% endfor %}
                    </div>

                </div>
            </div>
            {% endfor %}

        </div>
    </div>
</div>
