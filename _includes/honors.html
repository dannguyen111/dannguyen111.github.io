<div id="honors" class="section section-light">
    <div class="container">
        <h2 style="text-align: center; margin-bottom: 3rem;">Honors & Awards</h2>

        <div style="max-width: 900px; margin: 0 auto; display: grid; gap: var(--spacing-lg);">

            {% for award in site.data.honors %}
            <div class="honor-item">
                <div style="display: flex; justify-content: space-between; align-items: start; gap: 1rem;">
                    <div style="flex: 1;">
                        <h4 class="honor-title">{{ award.title }}</h4>
                        <div class="honor-org">{{ award.organization }}</div>
                        <div class="honor-date">{{ award.date }}</div>
                        <p class="honor-description">{{ award.description }}</p>
                    </div>
                </div>
            </div>
            {% endfor %}

        </div>
    </div>
</div>
